            <figure>
                <div class="scribble-wobble">
                <img src="img/Red_telephone.png" alt="Telephone" 
                title="Call me"/></div>
                <figcaption>
                    Call or text me!🤙
                </figcaption>
            </figure>
        </header>
        <hr>
        <main>
            <section aria-labelledby="contact-form-heading">
                <h2 id="contact-form-heading">My Contact Form</h2>
                <form action="https://httpbin.org/get" method="get">
                    <fieldset>
                        <legend>Send Me a Message</legend>
                        <p>
                            <label for="name">Name:</label>
                            <input type="text" name="name" id="name"
                                placeholder="Your name" autocomplete="name" required>
                        </p>
                        <p>
                            <label for="email">Email:</label>
                            <input type="email" name="email" id="email"
                                placeholder="Your email" autocomplete="email" required>
                        </p>
                        <p>
                            <label for="message">Your Message:</label>
                            <textarea name="message" id="message"
                                rows="10" placeholder="Type your message here" required></textarea>
                        </p>
                    </fieldset>
                    <button type="submit">Send</button>
                    <button type="reset">Reset</button>
                </form>
            </section>
            <section aria-labelledby="residence-heading">
                <h2 id="residence-heading">My Residence</h2>
                <address>
                    56 Five Star Road,<br>
                    South C,<br>
                    Nairobi 45043-00100.

                    Phone: <a href="tel:+254769719114">0769719114</a><br>
                    Email: <a href="mailto:mogususamuel0@gmail.com">mogususamuel0@gmail.com</a>
                    <br><br>
                    My social media handles: <a href="https://www.instagram.com/samzuma.kun/" target="_blank" rel="noopener noreferrer">Instagram</a><br>
                </address>
            </section>
            
        </main>
